<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parallax Animado con Keyframes</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="parallax-wrapper" id="gameContainer">
        <div class="parallax-layer layer-8"></div> 
        <div class="parallax-layer layer-7"></div> 
        <div class="parallax-layer layer-6"></div> 
        <div class="parallax-layer layer-5"></div> 
        <div class="parallax-layer layer-4"></div> 
        <div class="parallax-layer layer-3"></div> 
        <div class="parallax-layer layer-2"></div> 
        <div class="parallax-layer layer-1"></div> 
        
        <div class="flying-character" id="owl"></div>

        <div class="crystal crystal-1"></div>
        <div class="crystal crystal-2"></div>
        <div class="crystal crystal-3"></div>

        <div class="spider-container" id="spider">
            <div class="spider-thread"></div>
            <div class="spider"></div>
        </div>

        <div class="game-ui">
            <div>Puntos: <span id="score">0</span></div>
        </div>

        <div class="start-message" id="startMessage">
            Haz clic o presiona ESPACIO para comenzar
        </div>

        <div class="game-over" id="gameOver">
            <h2>¡Juego Terminado!</h2>
            <p>Puntuación: <span id="finalScore">0</span></p>
            <button onclick="resetGame()">Jugar de Nuevo</button>
        </div>
    </div>
    <script src="js.js"></script>
</body>
</html>
